<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PR Graph</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <a id="brand" class="brand" href="https://github.com/orangain/gh-pr-graph" target="_blank" rel="noreferrer" aria-label="PR Graph on GitHub"><img src="/logo.svg" alt=""><span>PR Graph</span></a>
    <form id="search-form">
      <label><input id="scope-authored" type="checkbox" checked> Authored</label>
      <label><input id="scope-assigned" type="checkbox" checked> Assigned</label>
      <label><input id="scope-review" type="checkbox" checked> Review requested</label>
      <span id="owner-scope" class="scope-chip" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 16A1.75 1.75 0 0 1 0 14.25V1.75C0 .784.784 0 1.75 0h8.5C11.216 0 12 .784 12 1.75v12.5c0 .085-.006.168-.018.25h2.268a.25.25 0 0 0 .25-.25V8.285a.25.25 0 0 0-.111-.208l-1.055-.703a.749.749 0 1 1 .832-1.248l1.055.703c.487.325.779.871.779 1.456v5.965A1.75 1.75 0 0 1 14.25 16h-3.5a.766.766 0 0 1-.197-.026c-.099.017-.2.026-.303.026h-3a.75.75 0 0 1-.75-.75V14h-1v1.25a.75.75 0 0 1-.75.75Zm-.25-1.75c0 .138.112.25.25.25H4v-1.25a.75.75 0 0 1 .75-.75h2.5a.75.75 0 0 1 .75.75v1.25h2.25a.25.25 0 0 0 .25-.25V1.75a.25.25 0 0 0-.25-.25h-8.5a.25.25 0 0 0-.25.25ZM3.75 6h.5a.75.75 0 0 1 0 1.5h-.5a.75.75 0 0 1 0-1.5ZM3 3.75A.75.75 0 0 1 3.75 3h.5a.75.75 0 0 1 0 1.5h-.5A.75.75 0 0 1 3 3.75Zm4 3A.75.75 0 0 1 7.75 6h.5a.75.75 0 0 1 0 1.5h-.5A.75.75 0 0 1 7 6.75ZM7.75 3h.5a.75.75 0 0 1 0 1.5h-.5a.75.75 0 0 1 0-1.5ZM3 9.75A.75.75 0 0 1 3.75 9h.5a.75.75 0 0 1 0 1.5h-.5A.75.75 0 0 1 3 9.75ZM7.75 9h.5a.75.75 0 0 1 0 1.5h-.5a.75.75 0 0 1 0-1.5Z"></path></svg><span></span></span>
      <span id="repo-scope" class="scope-chip" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"></path></svg><span></span></span>
      <input id="search" type="search" aria-label="Additional GitHub PR search" placeholder="Add another OR query…">
      <button type="submit">Search</button>
    </form>
    <button id="refresh" type="button" title="Refresh now">↻</button>
    <label class="auto"><input id="auto" type="checkbox" checked> Auto-refresh</label>
    <span id="updated" aria-live="polite"></span>
  </header>
  <div id="progress" class="progress" role="progressbar" aria-label="Loading pull requests" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
    <div class="progress-bar"></div>
    <span>Loading pull requests…</span>
  </div>
  <label class="graph-options" hidden><input id="show-bots" type="checkbox" checked> Show bots</label>
  <div id="warnings" role="status"></div>
  <main id="viewport">
    <div id="canvas"><svg id="edges" aria-hidden="true"></svg><div id="lanes"></div></div>
    <div id="empty" hidden>No pull requests found. Try a different search.</div>
  </main>
  <div id="copy-status" class="visually-hidden" role="status" aria-live="polite"></div>
  <div id="error" role="alert" hidden></div>
  <script src="/refresh.js" defer></script>
  <script src="/clipboard.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
